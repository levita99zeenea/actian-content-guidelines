<!-- Google Fonts: Roboto + Roboto Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

<script>
  document.addEventListener('DOMContentLoaded', function () {

    // ── Header: inject ACTIAN wordmark + separator alongside the logo img ──
    // just-the-docs renders: <a class="site-title"><img class="site-logo">Content Guidelines</a>
    // We wrap the title text and inject the wordmark spans after the logo image.
    var siteTitle = document.querySelector('.site-title');
    if (siteTitle) {
      var logoImg = siteTitle.querySelector('img.site-logo, .site-logo');
      var titleText = '';
      // Grab text nodes only (skip the img element)
      siteTitle.childNodes.forEach(function (node) {
        if (node.nodeType === Node.TEXT_NODE) {
          titleText += node.textContent;
        }
      });
      titleText = titleText.trim();

      // Rebuild: [img kept in place] + wordmark + separator + title
      var afterImg = logoImg ? logoImg.outerHTML : '';
      siteTitle.innerHTML =
        afterImg +
        '<span class="actian-wordmark">ACTIAN' +
          '<span class="actian-division">a division of HCLSoftware</span>' +
        '</span>' +
        '<span class="actian-header-sep" aria-hidden="true"></span>' +
        '<span class="actian-header-title">' + (titleText || 'Content Guidelines') + '</span>';
    }

    // ── Do / Don't table detection (backup for tables without IAL) ──
    // Normalises apostrophes before comparing — Kramdown outputs curly quotes.
    function normalizeApostrophes(s) {
      return s.replace(/[''‚‛]/g, "'");
    }

    document.querySelectorAll('table:not(.do-dont-table)').forEach(function (table) {
      var headers = table.querySelectorAll('thead th');
      if (headers.length >= 2) {
        var first  = normalizeApostrophes(headers[0].textContent.trim().toLowerCase());
        var second = normalizeApostrophes(headers[1].textContent.trim().toLowerCase());
        if (
          (first === 'do'  && second === "don't") ||
          (first === 'use' && second === 'avoid') ||
          (first.startsWith('recommended') && second === 'avoid')
        ) {
          table.classList.add('do-dont-table');
        }
      }
    });

  });
</script>
